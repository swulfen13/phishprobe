<!--
  DEMO: drive-by download page for the PhishProbe video. Fictional brand.

<body>
  <div class="card">
    <h1>🐦 ParcelPigeon Tracking-App</h1>
    <p>Ihr Download startet automatisch. Bitte installieren Sie die App, um Ihr Paket zu verfolgen.</p>
  </div>
  <script>
    // Auto-trigger a download of a tiny harmless dummy "executable".
    window.addEventListener('load', () => {
      const blob = new Blob(['MZ harmless-phishprobe-demo-dummy'], {type: 'application/octet-stream'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ParcelPigeon-Tracker-Setup.exe';
      document.body.appendChild(a);
      a.click();
    });
  </script>
