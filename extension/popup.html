<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 300px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
  button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px; background: #0ea5e9; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .result { margin-top: 10px; font-size: 13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; color:#fff; font-weight:600; }
  .muted { color:#64748b; font-size:12px; margin-top:10px; }
  details { margin-top:10px; } summary { cursor:pointer; font-size:12px; color:#64748b; }
  .settings input { font-size:12px; margin-top:6px; }
</style></head>
<body>
  <h1>🛡️ PhishProbe</h1>
  <input id="url" type="text" placeholder="Link einfügen …" autofocus>
  <button id="go">Prüfen</button>
  <div id="result" class="result"></div>
  <div class="muted">Startet einen Deep-Scan in der Vultr-Sandbox und öffnet das Ergebnis.</div>
  <details class="settings">
    <summary>Server-Adresse</summary>
    <input id="apiBase" type="text" placeholder="https://…">
  </details>
  <script src="popup.js"></script>
</body></html>
